name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - name: Use the declared npm version
        run: npm install --global "npm@$(node -p 'require("./package.json").engines.npm')"
      - name: Verify the declared toolchain
        run: |
          node -e 'const assert = require("node:assert/strict"); assert.equal(process.versions.node, require("./package.json").engines.node)'
          test "$(npm --version)" = "$(node -p 'require("./package.json").engines.npm')"
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
