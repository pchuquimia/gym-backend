name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Use the declared npm version
        run: npm install --global npm@11
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm audit --omit=dev
